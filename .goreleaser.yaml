# Release configuration. Tag a version (git tag v0.1.0 && git push origin v0.1.0)
# and .github/workflows/release.yml runs this on a macOS runner.
# See docs/releasing.md.
version: 2

project_name: meshtastik

builds:
  # macOS needs cgo (BLE stack and serial-port detection), so darwin builds
  # run on a Mac; Go passes -arch to clang, so one Mac builds both arches.
  - id: darwin
    main: ./cmd/meshtastik
    binary: meshtastik
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: -s -w -X meshtastik/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: other
    main: ./cmd/meshtastik
    binary: meshtastik
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: -s -w -X meshtastik/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # ircmesh: the IRC bridge, built the same two ways.
  - id: darwin-ircmesh
    main: ./cmd/ircmesh
    binary: ircmesh
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: other-ircmesh
    main: ./cmd/ircmesh
    binary: ircmesh
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^Add plan'

release:
  prerelease: auto

homebrew_casks:
  - name: meshtastik
    binaries: [meshtastik, ircmesh]
    homepage: https://github.com/fiskeben/meshtastik
    description: Administer a local Meshtastic radio node over serial, TCP or BLE, and chat on the mesh from IRC
    repository:
      owner: fiskeben
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "meshtastik {{ .Tag }}"
    # Pre-release tags (v1.0.0-rc1) publish a GitHub release but leave the tap alone.
    skip_upload: auto
    hooks:
      post:
        # The binaries aren't signed or notarized; without this, Gatekeeper
        # refuses to run a quarantined download.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/meshtastik"]
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ircmesh"]
          end
